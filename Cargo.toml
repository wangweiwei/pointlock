[workspace]
resolver = "2"
members = [
    "crates/pointlock-ir",
    "crates/pointlock-expr",
    "crates/pointlock-compiler",
    "crates/pointlock-provider-kit",
    "crates/pointlock-store",
    "crates/pointlock-runner",
    "crates/pointlock-provider-devicerail",
    "crates/pointlock-vision",
    "crates/pointlock-human-cli",
    "crates/pointlock-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/wangweiwei/pointlock"
homepage = "https://github.com/wangweiwei/pointlock"
publish = true

[workspace.dependencies]
# Internal crates (referenced by members via `workspace = true`).
# path + version: cargo builds against the local path in-workspace and
# publishes against the version on crates.io (a published dep must carry a version).
pointlock-ir = { path = "crates/pointlock-ir", version = "0.1.3" }
pointlock-expr = { path = "crates/pointlock-expr", version = "0.1.3" }
pointlock-compiler = { path = "crates/pointlock-compiler", version = "0.1.3" }
pointlock-provider-kit = { path = "crates/pointlock-provider-kit", version = "0.1.3" }
pointlock-store = { path = "crates/pointlock-store", version = "0.1.3" }
pointlock-runner = { path = "crates/pointlock-runner", version = "0.1.3" }
pointlock-provider-devicerail = { path = "crates/pointlock-provider-devicerail", version = "0.1.3" }
pointlock-vision = { path = "crates/pointlock-vision", version = "0.1.3" }
pointlock-human-cli = { path = "crates/pointlock-human-cli", version = "0.1.3" }

# DeviceRail Rust client (implemented in the sibling DeviceRail repository).
# The path keeps local development on the sibling checkout; the version is
# what published crates resolve from crates.io (design 04 §9, R12).
devicerail-client = { path = "../device-rail/crates/client", version = "0.3.3" }

# External dependencies (pre-declared; members opt in via `workspace = true`)
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = "0.33"
sha2 = "0.10"
gethostname = "0.5"
hmac = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
camino = "1"
serde_json_path = "0.7"
regex = "1"
# The projection HTTP host (`pointlock inspect --serve`, spine §10.4):
# a loopback single-user console — a small synchronous server fits the
# lightweight constitution (principle 10); SSE rides chunked responses.
tiny_http = "0.12"
percent-encoding = "2"
# The Anthropic-backed VisionVerifier (pointlock-vision): Rust has no
# official Anthropic SDK, so the sanctioned path is raw HTTP against the
# Messages API. rustls keeps the build self-contained.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
saphyr-parser = "0.0.11"
