[package]
name = "pointlock-provider-devicerail"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Pointlock's DeviceRail execution provider (real device / Android automation)."
keywords = ["pointlock", "devicerail", "android", "automation", "provider"]
categories = ["development-tools"]

[dependencies]
pointlock-ir = { workspace = true }
pointlock-provider-kit = { workspace = true }
# DeviceRail Rust client (architecture spine section 4.2, R12). The root
# workspace declares it with both a sibling path (local development) and the
# crates.io version that published copies of this crate resolve.
devicerail-client = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
