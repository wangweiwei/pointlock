name: Release

# Push a `v*` tag to publish. Locally, `scripts/release.sh` drives the whole
# release — it derives the next version from the chosen bump, rewrites every
# version touchpoint, commits, and pushes the tag:
#   scripts/release.sh publish          # interactive: current/major/minor/patch
#   scripts/release.sh publish patch    # non-interactive
# Pushing the tag triggers this workflow, which publishes the workspace to
# crates.io (and, opt-in, the npm packages). Publishing is irreversible
# (crates can only be yanked), so the tag is the single deliberate trigger.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for crates.io Trusted Publishing + npm provenance

jobs:
  # ---------------------------------------------------------------------------
  # crates.io — publishes all ten crates in dependency order.
  # pointlock-provider-devicerail resolves `devicerail-client` from crates.io
  # when published (the sibling path only serves local development).
  # ---------------------------------------------------------------------------
  crates:
    name: publish crates to crates.io
    runs-on: ubuntu-latest
    # Matches the sibling DeviceRail repo: the registry credential lives on a
    # protected environment rather than as a repository secret, so it is only
    # reachable from this job. A job that does not declare the environment
    # cannot read its secrets — `secrets.CARGO_REGISTRY_TOKEN` would silently
    # be empty and `cargo publish` would fail with "non-empty token".
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          path: pointlock

      # The workspace can only be *resolved* with the DeviceRail client present:
      # pointlock-provider-devicerail (a member) depends on it via the sibling
      # path `../device-rail/crates/client`; checking it out next to
      # `pointlock/` makes the path resolve. The sibling is public at a fixed
      # address, so it is the default here — the DEVICERAIL_REPO repository
      # variable is only an override for forks. No token is passed: an unset
      # secret would arrive as an empty string, which `actions/checkout`
      # rejects outright instead of treating as absent. For a private sibling,
      # add back `token: ${{ secrets.DEVICERAIL_TOKEN }}`.
      - name: Check out the DeviceRail sibling (workspace resolution)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEVICERAIL_REPO || 'wangweiwei/device-rail' }}
          path: device-rail

      - name: Verify the sibling checkout is really DeviceRail
        run: |
          test -f device-rail/crates/client/Cargo.toml || {
            echo "::error::device-rail/crates/client/Cargo.toml is missing — DEVICERAIL_REPO does not point at the DeviceRail repository."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pointlock

      # The tag must match the workspace version, or `v0.2.0` would ship 0.1.0.
      - name: Verify tag matches workspace version
        working-directory: pointlock
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$tag  workspace=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != workspace version $ver"; exit 1; }

      # Never publish a version that does not pass the full local gate.
      - name: Gates (fmt + clippy + test)
        working-directory: pointlock
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # First releases use a classic token: crates.io Trusted Publishing can
      # only be configured on a crate that already exists, so brand-new crates
      # cannot mint an OIDC token. Store a short-lived token that may create
      # new crates as the CARGO_REGISTRY_TOKEN secret, and after the first
      # release revoke it, configure a Trusted Publisher on every crate
      # (this workflow file, no environment), and swap the env below for:
      #   - uses: rust-lang/crates-io-auth-action@v1
      #     id: auth
      #   ...
      #   CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish crates in dependency order
        working-directory: pointlock
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          # crates.io throttles the creation of NEW crates: a burst of five,
          # then one per ten minutes. A ten-crate first release therefore
          # cannot finish in one pass, and the rejection is a 429 naming the
          # exact instant the window reopens. Wait for that instant and retry
          # rather than making a human re-run the workflow once per crate.
          # Only new-crate creation is throttled this hard — later releases
          # publish versions of existing crates under a far looser limit, so
          # this backoff is effectively first-release-only.
          publish_with_backoff() {
            local crate="$1" attempt log retry_at target now wait
            log="$(mktemp)"
            for attempt in 1 2 3 4 5 6 7 8; do
              if cargo publish -p "$crate" >"$log" 2>&1; then
                cat "$log"; rm -f "$log"; return 0
              fi
              cat "$log"
              retry_at="$(sed -n 's/.*Please try again after \(.*\) and see.*/\1/p' "$log" | head -1)"
              if [ -z "$retry_at" ]; then
                rm -f "$log"
                echo "::error::publishing $crate failed for a reason other than rate limiting"
                return 1
              fi
              target="$(date -u -d "$retry_at" +%s 2>/dev/null || echo '')"
              now="$(date -u +%s)"
              if [ -z "$target" ] || [ "$target" -le "$now" ]; then
                wait=60
              else
                wait=$(( target - now + 15 ))
              fi
              echo "::notice::crates.io rate limit hit on $crate; waiting ${wait}s until $retry_at (attempt $attempt)"
              sleep "$wait"
            done
            rm -f "$log"
            echo "::error::$crate still rate limited after 8 attempts"
            return 1
          }

          for c in \
            pointlock-ir \
            pointlock-expr \
            pointlock-provider-kit \
            pointlock-vision \
            pointlock-store \
            pointlock-compiler \
            pointlock-human-cli \
            pointlock-runner \
            pointlock-provider-devicerail \
            pointlock-cli
          do
            # Skipping what crates.io already has makes a re-run after a
            # partial publish safe: the loop resumes at the first missing
            # crate instead of failing on an already-published one.
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'User-Agent: Pointlock release workflow' \
              "https://crates.io/api/v1/crates/$c/$version")"
            if [ "$status" = "200" ]; then
              echo "$c $version is already on crates.io; skipping"
              continue
            fi
            if [ "$status" != "404" ]; then
              echo "::error::crates.io returned HTTP $status for $c $version"
              exit 1
            fi
            echo "::group::cargo publish -p $c"
            publish_with_backoff "$c"
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # npm — opt-in. Set the repository variable PUBLISH_NPM=true and put an
  # automation token for the @pointlock scope on the `npm` environment as
  # NPM_TOKEN to enable. Publishes only the two library packages; ir-types
  # (generated, type-only — private until its consumption surface stabilizes),
  # walk-drafter (registered in spine A.1, unpublished in v0.1) and ui
  # (app) stay private.
  # ---------------------------------------------------------------------------
  npm:
    name: publish npm packages
    runs-on: ubuntu-latest
    needs: crates
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    # Same rationale as the crates job: the credential is scoped to a
    # protected environment. A repository secret of the same name still
    # resolves here, so an existing repo-level NPM_TOKEN keeps working.
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Publish @pointlock/projection-types and @pointlock/nl-drafter
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for directory in packages/projection-types packages/nl-drafter; do
            name="$(node -p "require('./$directory/package.json').name")"
            # Same re-run safety as the crates loop: skip what npm already has.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
              continue
            fi
            ( cd "$directory" && npm publish --provenance --access public )
          done
